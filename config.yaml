# Default configuration for a single-instrument backtest (`python main.py`).
# The basket study (`scripts/run_study.py`) overrides `ticker` per instrument.

ticker: "PETR4.SA"
start: "2010-01-01"
end:   "2026-01-01"
interval: "1d"

capital_inicial: 10000
risco_por_trade_pct: 0.5        # fixed risk per trade, % of equity (0.25 to 2.0)

custos:
  spread: 0.02                  # price units (e.g. R$ 0.02 per share, round-trip)
  comissao: 0.0                 # currency per order (entry + exit)
  slippage_frac: 0.05           # fraction of the entry candle range, per fill

estrategia:
  nome: "ma_crossover"
  ma_rapida: 20
  ma_lenta: 50
  atr_periodo: 14
  stop_atr_mult: 1.5
  alvo_atr_mult: 3.0
  direction: "long_only"        # long_only | long_short

montecarlo:
  n_simulacoes: 5000
  seed: 42
  drawdown_alvo_pct: 50
  niveis_risco: [0.5, 1.0, 2.0, 5.0]
